# Railway alternative (see DEPLOY.md). Add a Volume mounted at /data in the Railway dashboard.
# Keep ONE replica: the database is a single SQLite file on that volume.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
numReplicas = 1
