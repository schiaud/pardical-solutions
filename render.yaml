# Render Blueprint: one web service + a persistent disk for the SQLite database.
# Render → New → Blueprint → pick this repo. Then fill ADMIN_PASSWORD (and the optional keys) when asked.
services:
  - type: web
    name: pardical-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: pardical-data
      mountPath: /data
      sizeGB: 1
    domains:
      - pardical.com
      - www.pardical.com
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://pardical.com
      - key: APP_HOSTS
        value: pardical.com,www.pardical.com
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KYC_OWNER_NAME
        sync: false
      - key: KYC_EMAIL
        sync: false
      - key: KYC_PHONE
        sync: false
      - key: KYC_ADDRESS
        sync: false
