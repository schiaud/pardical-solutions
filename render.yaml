# Render Blueprint: one web service + a persistent disk for the SQLite database.
# Render → New → Blueprint → pick this repo and branch. Fill the optional keys and KYC_* values when asked.
services:
  - type: web
    name: pardical-web
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: pardical-data
      mountPath: /data
      sizeGB: 1
    domains:
      - pardical.com # Render adds www.pardical.com and redirects it here
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true # read it from the service's Environment tab
      - key: SITE_URL
        value: https://pardical.com
      - key: APP_HOSTS
        value: pardical.com,www.pardical.com
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KYC_OWNER_NAME
        sync: false
      - key: KYC_EMAIL
        sync: false
      - key: KYC_PHONE
        sync: false
      - key: KYC_ADDRESS
        sync: false
